<!DOCTYPE html>
<html>
<head>
    <title>VOXL 2 Hardware Quickstart Diagram</title>
    <style>
        .diagram {
            width: 600px;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 20px auto;
            position: relative;
            background-color: #f8f9fa;
        }
        
        .device {
            position: absolute;
            width: 180px;
            height: 100px;
            background-color: #d0d0d0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .voxl {
            top: 150px;
            left: 60px;
            background-color: #eee;
        }
        
        .power-module {
            top: 50px;
            right: 80px;
            background-color: #e0e0e0;
        }
        
        .computer {
            bottom: 50px;
            right: 80px;
            background-color: #e0e0e0;
        }
        
        .connector {
            position: absolute;
            background-color: #0d6efd;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .j4 {
            top: 130px;
            left: 150px;
        }
        
        .j9 {
            top: 190px;
            left: 150px;
        }
        
        .line {
            position: absolute;
            height: 2px;
            background-color: #333;
        }
        
        .power-line {
            width: 180px;
            top: 85px;
            left: 190px;
            transform: rotate(-15deg);
        }
        
        .usb-line {
            width: 150px;
            top: 195px;
            left: 180px;
            transform: rotate(20deg);
        }
        
        .label {
            position: absolute;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }
        
        .power-label {
            top: 70px;
            left: 250px;
            color: #333;
        }
        
        .usb-label {
            top: 210px;
            left: 200px;
            color: #333;
        }
        
        .title {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 18px;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="title">VOXL 2 Hardware Quickstart Diagram</div>
    <div class="diagram">
        <div class="device voxl">VOXL 2</div>
        <div class="device power-module">Power Module</div>
        <div class="device computer">Host Computer</div>
        
        <div class="connector j4">J4</div>
        <div class="connector j9">J9</div>
        
        <div class="line power-line"></div>
        <div class="line usb-line"></div>
        
        <div class="label power-label">5V Power Cable</div>
        <div class="label usb-label">USB-C Cable</div>
    </div>
</body>
</html>
