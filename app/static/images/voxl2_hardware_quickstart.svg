<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="8" ry="8" stroke="#ccc" stroke-width="1"/>
  
  <!-- VOXL 2 Device -->
  <rect x="60" y="150" width="180" height="100" rx="8" ry="8" fill="#eee" stroke="#999" stroke-width="1"/>
  <text x="150" y="200" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">VOXL 2</text>
  
  <!-- Power Module -->
  <rect x="360" y="50" width="180" height="100" rx="8" ry="8" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="450" y="100" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Power Module</text>
  
  <!-- Host Computer -->
  <rect x="360" y="250" width="180" height="100" rx="8" ry="8" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="450" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Host Computer</text>
  
  <!-- Connectors -->
  <rect x="150" y="130" width="30" height="20" rx="4" ry="4" fill="#0d6efd" stroke="#0056b3" stroke-width="1"/>
  <text x="165" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="white">J4</text>
  
  <rect x="150" y="250" width="30" height="20" rx="4" ry="4" fill="#0d6efd" stroke="#0056b3" stroke-width="1"/>
  <text x="165" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="white">J9</text>
  
  <!-- Connection Lines -->
  <line x1="180" y1="140" x2="360" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="260" x2="360" y2="290" stroke="#333" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="250" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">5V Power Cable</text>
  <text x="250" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">USB-C Cable</text>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">VOXL 2 Hardware Quickstart Diagram</text>
</svg>