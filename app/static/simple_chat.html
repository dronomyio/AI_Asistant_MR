<!DOCTYPE html>
<html>
<head>
    <title>Simple Chat with Hardware Image</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-container { max-width: 800px; margin: 0 auto; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .chat-header { background: #0066cc; color: white; padding: 10px; }
        .chat-messages { height: 400px; overflow-y: auto; padding: 15px; }
        .message { margin-bottom: 15px; }
        .user-message { text-align: right; }
        .bot-message { text-align: left; }
        .message-content { display: inline-block; padding: 10px; border-radius: 8px; max-width: 70%; }
        .user-message .message-content { background: #0066cc; color: white; }
        .bot-message .message-content { background: #f1f1f1; }
        .chat-input { display: flex; padding: 10px; background: #f1f1f1; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { margin-left: 10px; padding: 10px 15px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        img { max-width: 100%; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2 style="margin: 0;">VOXL 2 Documentation Chat</h2>
        </div>
        <div class="chat-messages" id="messages">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! How can I help you with VOXL 2 information today?
                </div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="input" placeholder="Type your message...">
            <button id="send">Send</button>
        </div>
    </div>

    <div style="margin-top: 20px; text-align: center;">
        <button id="show-hardware" style="background: #28a745;">Show Hardware Diagram</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messagesDiv = document.getElementById('messages');
            const inputField = document.getElementById('input');
            const sendButton = document.getElementById('send');
            const hardwareButton = document.getElementById('show-hardware');
            
            // Hardware info message HTML
            const hardwareHTML = `
                <div class="message bot-message">
                    <div class="message-content">
                        <p>The VOXL 2 hardware setup requires connecting power to the J1 connector. 
                        You'll need a stable power source between 6V and 18V, typically a 4S or 6S LiPo battery 
                        for drone applications.</p>
                        <img src="images/voxl2_hardware.png" alt="VOXL 2 Hardware Diagram">
                        <p style="font-size: 0.8em; color: #666;">VOXL 2 Hardware Connection Diagram</p>
                    </div>
                </div>
            `;
            
            // Add a message to the chat
            function addMessage(text, isUser) {
                const messageDiv = document.createElement('div');
                messageDiv.className = isUser ? 'message user-message' : 'message bot-message';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;
                
                messageDiv.appendChild(contentDiv);
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                
                return contentDiv;
            }
            
            // Show hardware info when button is clicked
            hardwareButton.addEventListener('click', function() {
                // Add hardware message directly to the DOM
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = hardwareHTML;
                messagesDiv.appendChild(tempDiv.firstElementChild);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
            
            // Handle send button click
            sendButton.addEventListener('click', function() {
                const message = inputField.value.trim();
                if (message === '') return;
                
                // Add user message
                addMessage(message, true);
                
                // Clear input
                inputField.value = '';
                
                // Simple response logic
                setTimeout(function() {
                    if (message.toLowerCase().includes('hardware') || 
                        message.toLowerCase().includes('diagram') || 
                        message.toLowerCase().includes('voxl')) {
                        // Add hardware message directly to the DOM
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = hardwareHTML;
                        messagesDiv.appendChild(tempDiv.firstElementChild);
                    } else {
                        addMessage("I'm programmed to show the VOXL 2 hardware diagram. Please ask about hardware or click the green button below.", false);
                    }
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 500);
            });
            
            // Allow pressing Enter to send
            inputField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendButton.click();
                }
            });
        });
    </script>
</body>
</html>
